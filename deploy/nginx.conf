# Nginx configuration of the `apexvoid-photobooth-webpage` container (internal port 80).
# TLS, the public ports and the domain are handled by the central routing proxy, not here.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro builds every route as <route>/index.html; "/features" redirects to "/features/".
    absolute_redirect off;
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # fingerprinted build assets never change
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # pages and other files: always revalidate
    location ~* \.(html|xml|txt)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header X-Frame-Options "DENY" always;
    }

    # ---------------------------------------------------------------- release downloads
    # Release storage is bind-mounted read-only at /srv/photobooth-downloads (ansible-library
    # photobooth_release_public_dir). Only the manifest and the allow-listed files of a versioned release
    # directory are served; everything else under /downloads/ is a 404 — no listing, no fallback to the site.
    # `^~` keeps the site-wide regex locations (e.g. the .txt header rule) away from these files.
    location ^~ /downloads/ {
        autoindex off;
        disable_symlinks on;
        gzip off;  # byte ranges and exact Content-Length for every file
        types { }

        location = /downloads/index.json {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            alias /srv/photobooth-downloads/index.json;
            default_type "application/json; charset=utf-8";
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Executables are revalidated frequently so removed versions stop being served from shared caches.
        location ~ "^/downloads/releases/(?<dl_dir>v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?)/(?<dl_file>ApexVoidPhotobooth-v[0-9A-Za-z.-]+-windows-x64\.exe)$" {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            alias /srv/photobooth-downloads/releases/$dl_dir/$dl_file;
            default_type application/octet-stream;
            add_header Content-Disposition 'attachment; filename="$dl_file"';
            add_header Cache-Control "public, max-age=300, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Checksums and release metadata use the same bounded cache as expiring executable files.
        location ~ "^/downloads/releases/(?<dl_dir>v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?)/(?<dl_file>SHA256SUMS|RELEASE-NOTES\.md|THIRD-PARTY-NOTICES\.txt|LICENSE\.txt|SOURCE\.md)$" {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            alias /srv/photobooth-downloads/releases/$dl_dir/$dl_file;
            default_type "text/plain; charset=utf-8";
            add_header Cache-Control "public, max-age=300, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
        }

        return 404;
    }

    gzip on;
    gzip_types text/css application/javascript text/javascript application/xml image/svg+xml text/plain;
}
