# Nginx configuration for the future `apexvoid-photobooth-webpage` container (internal port 80).
# TLS, the public ports and the domain are handled by the central routing proxy, not here.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro builds every route as <route>/index.html; "/features" redirects to "/features/".
    absolute_redirect off;
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # fingerprinted build assets never change
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # pages and other files: always revalidate
    location ~* \.(html|xml|txt)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header X-Frame-Options "DENY" always;
    }

    gzip on;
    gzip_types text/css application/javascript text/javascript application/xml image/svg+xml text/plain;
}
