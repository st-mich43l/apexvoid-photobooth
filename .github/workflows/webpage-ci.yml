# Website CI and deployment. Lives only on the `webpage` branch, so it never runs for the desktop
# application, and the desktop CI (ci.yml on master/community) does not exist on this branch.
# Linux only: no Go, no Windows runners, no Canon SDK, no desktop builds.
# Pull requests and feature branches (`webpage-<topic>`) are only checked; a push to `webpage`
# that passes every check is built into an image and deployed to photobooth.apexvoid.net.
# (Git cannot hold `webpage/<topic>` next to `webpage`, so feature branches use a dash.)
name: webpage-ci

on:
  push:
    branches: [webpage, "webpage-*"]
  pull_request:
    branches: [webpage]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webpage-ci-${{ github.event.pull_request.number || github.ref }}
  # superseded checks are cancelled, but never a deployment that is already running
  cancel-in-progress: ${{ github.ref != 'refs/heads/webpage' }}

jobs:
  site:
    name: lint · check · test · build · browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Formatting and lint
        run: npm run lint

      - name: Astro and TypeScript checks
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build the static site and check every internal link and route
        run: npm run build

      - name: Nginx /downloads/ infrastructure test (real Nginx, read-only test storage, no production data)
        run: scripts/test-downloads-nginx.sh

      - name: Install the browser for smoke tests
        run: npx playwright install --with-deps chromium

      - name: Browser journeys (routes, language, theme, mobile nav, download states, layout widths, axe)
        run: npm run test:e2e

      - name: Upload the built site
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: webpage-dist
          path: |
            dist/
            artifacts/footer-shots/
          retention-days: 14

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Build the image (deploy/Dockerfile), push it to Docker Hub and deploy it with the shared
  # pipeline (action-library -> ansible-library project `apexvoid-photobooth-webpage`).
  # Only for pushes to `webpage` (or a manual run on it), and only after every check above passed.
  deploy:
    name: build · push · deploy
    needs: site
    if: github.ref == 'refs/heads/webpage' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: st-mich43l/action-library/.github/workflows/build-push-deploy.yml@master
    with:
      project: apexvoid-photobooth-webpage
      registry-namespace: mich43l
      # Pinned to the retention publisher and storage provisioning changes in ansible-library #164.
      # Bump deliberately when ansible-library changes this project's deployment requirements.
      ansible-library-ref: 39b11863a4683dc5c3c4dd444300becda8cc3b81
      images: >-
        [
          {"name": "apexvoid-photobooth-webpage", "context": ".", "dockerfile": "deploy/Dockerfile"}
        ]
    secrets:
      registry-token: ${{ secrets.DOCKERHUB_TOKEN }}
      vault-password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
