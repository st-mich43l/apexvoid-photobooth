# Website CI. Lives only on the `webpage` branch, so it never runs for the desktop application,
# and the desktop CI (ci.yml on master/community) does not exist on this branch.
# Linux only: no Go, no Windows runners, no vault, no Canon SDK, no desktop builds.
name: webpage-ci

on:
  push:
    branches: [webpage, "webpage/**"]
  pull_request:
    branches: [webpage]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webpage-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: lint · check · test · build · browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Formatting and lint
        run: npm run lint

      - name: Astro and TypeScript checks
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build the static site and check every internal link and route
        run: npm run build

      - name: Install the browser for smoke tests
        run: npx playwright install --with-deps chromium

      - name: Browser journeys (routes, language, theme, mobile nav, download state, layout widths, axe)
        run: npm run test:e2e

      - name: Upload the built site
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: webpage-dist
          path: dist/
          retention-days: 14

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
