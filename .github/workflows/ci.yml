name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Everything that can be tested without a camera: Go unit/contract/recovery
  # tests (mock camera, fake Canon SDK, synthetic FFmpeg source), vet, format.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install FFmpeg (synthetic-source video tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: go mod tidy is clean
        run: |
          mkdir -p cmd/photobooth/frontend_dist && echo placeholder > cmd/photobooth/frontend_dist/index.html
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal)"
      - name: Version consistency (frontend/package.json is the authority) and release tooling tests
        run: |
          python3 scripts/release/release.py check-version
          python3 -m unittest discover -s scripts/release -v
      - name: vet (portable packages)
        run: go vet ./internal/...
      - name: vet (Windows build of the whole app, incl. Canon EDSDK DLL binding)
        run: |
          mkdir -p cmd/photobooth/frontend_dist && echo placeholder > cmd/photobooth/frontend_dist/index.html # go:embed needs the folder
          GOOS=windows GOARCH=amd64 go vet ./...
      - name: test
        run: go test -count=1 ./internal/...
      - name: 100 simulated sessions (not physical hardware acceptance)
        env:
          UX6_ENDURANCE: '1'
        run: go test -count=1 -v ./internal/capture -run '^TestSimulatedEndurance100Sessions$'
      - name: test with race detector (concurrency-critical packages)
        run: go test -race -count=1 ./internal/camera/... ./internal/capture/... ./internal/sessions/... ./internal/video/... ./internal/storage/...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Test a Windows build with LGPL FFmpeg built in (unpacked at first use and run as
  # a separate process; see docs/THIRD-PARTY.md). FFmpeg is pinned by release tag + SHA-256 and never committed.
  windows:
    name: Windows x64 build and self-tests
    runs-on: windows-latest
    needs: [go, frontend]
    outputs:
      release_sha256: ${{ steps.candidate.outputs.sha256 }}
    env:
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-21-12-37/ffmpeg-n8.1.3-39-g660b5aa7db-win64-lgpl-8.1.zip
      FFMPEG_SHA256: 47d2e37e5ab9dc775cf5e5e595a817a11534c2fd6533a16db476f45dd8a7ce83
      FFMPEG_DIR: ffmpeg-n8.1.3-39-g660b5aa7db-win64-lgpl-8.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Fetch the pinned FFmpeg, verify its SHA-256 and prepare it for embedding
        shell: pwsh
        run: |
          Invoke-WebRequest $env:FFMPEG_URL -OutFile ffmpeg.zip
          $h = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:FFMPEG_SHA256) { throw "FFmpeg download hash mismatch: $h" }
          Expand-Archive ffmpeg.zip ffx
          $src = Join-Path "ffx\$env:FFMPEG_DIR" 'bin\ffmpeg.exe'
          New-Item internal\video\embedded -ItemType Directory | Out-Null
          $in = [System.IO.File]::OpenRead($src)
          $out = [System.IO.File]::Create("internal\video\embedded\ffmpeg.exe.gz")
          $gz = New-Object System.IO.Compression.GZipStream($out, [System.IO.Compression.CompressionLevel]::SmallestSize)
          $in.CopyTo($gz); $gz.Close(); $out.Close(); $in.Close()
          Copy-Item "ffx\$env:FFMPEG_DIR\LICENSE.txt" internal\video\embedded\FFMPEG-LICENSE.txt
          Get-Item internal\video\embedded\* | Select-Object Name, Length
      - name: Go tests on Windows (portable packages)
        shell: bash
        run: go test -count=1 ./internal/... ./cmd/photobooth
      - name: Windows resources (icon, manifest, version info)
        shell: bash
        working-directory: cmd/photobooth
        run: go run github.com/tc-hib/go-winres@v0.3.3 make --in ../../build/winres/winres.json --arch amd64
      - name: Build the single executable (FFmpeg built in)
        shell: bash
        run: |
          mkdir -p dist
          app_version=$(node -p "require('./frontend/package.json').version")
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -tags embedffmpeg \
            -ldflags "-H windowsgui -s -w -X main.version=${app_version}+${GITHUB_SHA::7}" \
            -o dist/ApexVoidPhotobooth.exe ./cmd/photobooth
          ls -l dist
      - name: Self-test (start-up, SQLite, loopback server, simulated session; no window, no network, no ffmpeg beside the app)
        shell: pwsh
        run: |
          Remove-Item "$env:LOCALAPPDATA\ApexVoidPhotobooth\bin" -Recurse -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath dist\ApexVoidPhotobooth.exe -ArgumentList '--selftest', "$PWD\selftest.json" -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
          $r = Get-Content selftest.json | ConvertFrom-Json
          $ff = $r.checks | Where-Object { $_.name -eq 'FFmpeg' }
          $enc = $r.checks | Where-Object { $_.name -eq 'H.264 encoder' }
          if (-not $ff.ok -or $ff.detail -notlike '*built into this application*') { throw "the built-in FFmpeg was not found/unpacked: $($ff.detail)" }
          if (-not $enc.ok) { throw "the built-in FFmpeg has no usable H.264 encoder: $($enc.detail)" }
          Write-Host "FFmpeg: $($ff.detail); encoder: $($enc.detail)"
          if (-not $r.frameFlow.ok) { throw "the frame flow (choose a frame, 4 photos, compose, two-up sheet) failed: $($r.frameFlow | ConvertTo-Json)" }
          Write-Host "Frame flow: strip $($r.frameFlow.stripPixels) @ $($r.frameFlow.dpi) dpi with $($r.frameFlow.frame)/$($r.frameFlow.variant); two-up sheet $($r.frameFlow.twoUpPixels)"
          if (-not $r.frameFlow600.ok) { throw "the 600 dpi frame flow failed: $($r.frameFlow600 | ConvertTo-Json)" }
          Write-Host "600 dpi: strip $($r.frameFlow600.stripPixels) @ $($r.frameFlow600.dpi) dpi; two-up sheet $($r.frameFlow600.twoUpPixels)"
          New-Item dist\ci-evidence -ItemType Directory -Force | Out-Null
          Copy-Item selftest-frame-*.jpg dist\ci-evidence\
      - name: Check bundled notices on Windows
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ApexVoidPhotobooth.exe -ArgumentList '--notices', "$PWD\notices-ci.txt" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path notices-ci.txt)) { throw 'Could not export bundled notices' }
          $notices = Get-Content notices-ci.txt -Raw
          if ($notices -notmatch 'SIL OPEN FONT LICENSE' -or $notices -notmatch 'GNU LESSER GENERAL PUBLIC LICENSE') { throw 'Bundled notices are incomplete' }
      - name: "Camera probe on the runner (no camera attached; native enumeration must work and report everything as unverified)"
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ApexVoidPhotobooth.exe -ArgumentList '--probe-cameras', "$PWD\probe-real.json" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "probe failed with exit code $($p.ExitCode)" }
          Get-Content probe-real.json
          $p = Start-Process -FilePath dist\ApexVoidPhotobooth.exe -ArgumentList '--probe-cameras', "$PWD\probe-mock.json", '--include-mock' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "mock probe failed with exit code $($p.ExitCode)" }
          $r = Get-Content probe-mock.json | ConvertFrom-Json
          if (-not $r.devices[0].still.ok) { throw "simulated still capture failed on Windows" }
      - name: Windows printing through the real spooler and GDI (file-port printer)
        shell: pwsh
        run: |
          # 1. enumeration never needs a printer
          $p = Start-Process -FilePath dist\ApexVoidPhotobooth.exe -ArgumentList '--print-selftest', "$PWD\print-enum.json" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "printer enumeration failed" }
          Get-Content print-enum.json
          # 2. a software printer that writes to a file port (no dialog) lets us exercise StartDoc/StretchDIBits/EndDoc for real
          $drv = Get-PrinterDriver | Where-Object { $_.Name -in 'Microsoft Print To PDF', 'Microsoft XPS Document Writer', 'Microsoft XPS Document Writer v4' } | Select-Object -First 1
          Get-PrinterDriver | Select-Object Name | Format-Table | Out-String | Write-Host
          if (-not $drv) { Write-Host "::warning::No Microsoft Print To PDF / XPS driver on this runner: native printing could NOT be exercised (unverified)"; exit 0 }
          $ext = if ($drv.Name -like '*PDF*') { 'pdf' } else { 'xps' }
          $out = Join-Path $env:RUNNER_TEMP "ci-print.$ext"
          Remove-Item $out -ErrorAction SilentlyContinue
          Add-PrinterPort -Name $out
          Add-Printer -Name 'CI-FILE' -DriverName $drv.Name -PortName $out
          $p = Start-Process -FilePath dist\ApexVoidPhotobooth.exe -ArgumentList '--print-selftest', "$PWD\print-real.json", 'CI-FILE' -Wait -PassThru
          Get-Content print-real.json
          if ($p.ExitCode -ne 0) { throw "native print self-test failed (exit $($p.ExitCode))" }
          if (-not (Test-Path $out)) { throw "the printer produced no output file at $out" }
          $len = (Get-Item $out).Length
          $bytes = [System.IO.File]::ReadAllBytes($out)
          $head = [System.Text.Encoding]::ASCII.GetString($bytes, 0, [Math]::Min(5, $bytes.Length))
          Write-Host "output: $out ($len bytes), header '$head'"
          if ($len -lt 1000) { throw "output file is implausibly small" }
          if ($ext -eq 'pdf' -and -not $head.StartsWith('%PDF')) { throw "the output is not a PDF (header '$head')" }
          if ($ext -eq 'xps' -and -not $head.StartsWith('PK')) { throw "the output is not an XPS/zip package (header '$head')" }
          New-Item dist\ci-evidence -ItemType Directory -Force | Out-Null
          Copy-Item $out dist\ci-evidence\ci-print-output.$ext
          Copy-Item print-real.json dist\ci-evidence\print-selftest-report.json
          Copy-Item selftest.json dist\ci-evidence\selftest-report.json -ErrorAction SilentlyContinue
      # The executable every check above validated, kept unchanged for the publish job (no rebuild).
      - name: Record the release candidate checksum (master only)
        id: candidate
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\ApexVoidPhotobooth.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$h" >> $env:GITHUB_OUTPUT
          "Standard release candidate SHA-256: $h" >> $env:GITHUB_STEP_SUMMARY
      - name: Keep the validated executable and its notices (master only)
        if: steps.candidate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-standard
          path: |
            dist/ApexVoidPhotobooth.exe
            notices-ci.txt
          if-no-files-found: error
          retention-days: 30
  # Trusted master builds can use the vaulted SDK. Pull requests, including
  # forks, never receive the vault password.
  canon-portable:
    name: Build Canon-enabled Windows portable executable
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: [go, frontend, windows]
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
      artifact_id: ${{ steps.portable.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: st-mich43l/ansible-library
          # The build script verifies the exact expected SDK hashes.
          ref: master
          path: .canon-ansible
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Ansible Vault
        run: python -m pip install 'ansible-core==2.21.4'
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Prepare pinned FFmpeg
        env:
          FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-21-12-37/ffmpeg-n8.1.3-39-g660b5aa7db-win64-lgpl-8.1.zip
          FFMPEG_SHA256: 47d2e37e5ab9dc775cf5e5e595a817a11534c2fd6533a16db476f45dd8a7ce83
        run: |
          curl --fail --location --retry 3 "$FFMPEG_URL" --output "$RUNNER_TEMP/ffmpeg.zip"
          echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.zip" | sha256sum -c -
          mkdir -p internal/video/embedded
          python - <<'PY'
          import gzip, os, shutil, zipfile
          prefix = 'ffmpeg-n8.1.3-39-g660b5aa7db-win64-lgpl-8.1/'
          with zipfile.ZipFile(os.path.join(os.environ['RUNNER_TEMP'], 'ffmpeg.zip')) as z:
              with z.open(prefix + 'bin/ffmpeg.exe') as src, gzip.open('internal/video/embedded/ffmpeg.exe.gz', 'wb', compresslevel=9) as dst:
                  shutil.copyfileobj(src, dst)
              with z.open(prefix + 'LICENSE.txt') as src, open('internal/video/embedded/FFMPEG-LICENSE.txt', 'wb') as dst:
                  shutil.copyfileobj(src, dst)
          PY
      - name: Generate Windows resources
        working-directory: cmd/photobooth
        run: go run github.com/tc-hib/go-winres@v0.3.3 make --in ../../build/winres/winres.json --arch amd64
      - name: Build with vaulted SDK and FFmpeg
        env:
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          REQUIRE_EMBEDDED_FFMPEG: '1'
        run: |
          set -euo pipefail
          if [ -z "$VAULT_PASSWORD" ]; then echo 'ANSIBLE_VAULT_PASSWORD is required for the Canon build' >&2; exit 1; fi
          umask 077
          password_file=$(mktemp "$RUNNER_TEMP/canon-vault.XXXXXX")
          trap 'rm -f "$password_file"' EXIT
          printf '%s\n' "$VAULT_PASSWORD" > "$password_file"
          unset VAULT_PASSWORD
          APP_VERSION="$(node -p "require('./frontend/package.json').version")+${GITHUB_SHA::7}" ./scripts/build-canon-portable.sh "$GITHUB_WORKSPACE/.canon-ansible" "$password_file"
          mv dist/ApexVoidPhotobooth-canon.exe dist/ApexVoidPhotobooth.exe
      - name: Record executable checksum
        id: checksum
        run: |
          hash=$(sha256sum dist/ApexVoidPhotobooth.exe | cut -d ' ' -f 1)
          echo "sha256=$hash" >> "$GITHUB_OUTPUT"
          echo "Portable executable SHA-256: $hash" >> "$GITHUB_STEP_SUMMARY"
      # One artifact with one file. The Windows job validates this exact file;
      # use the download only when the complete workflow succeeds.
      - uses: actions/upload-artifact@v4
        id: portable
        with:
          name: ApexVoidPhotobooth-windows-x64
          path: dist/ApexVoidPhotobooth.exe
          if-no-files-found: error
          retention-days: 30

  canon-windows-smoke:
    name: Validate Canon-enabled executable on Windows
    runs-on: windows-latest
    needs: [canon-portable]
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ApexVoidPhotobooth-windows-x64
          path: dist
      - name: Verify the published executable
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ needs.canon-portable.outputs.sha256 }}
        run: |
          $files = @(Get-ChildItem dist -File -Recurse)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'ApexVoidPhotobooth.exe') { throw 'Artifact must contain exactly one executable' }
          $actual = (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:EXPECTED_SHA256) { throw 'Artifact checksum does not match the build' }
      - name: Check the embedded third-party notices
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ApexVoidPhotobooth.exe -ArgumentList '--notices', "$PWD\notices-ci.txt" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path notices-ci.txt)) { throw 'Portable executable did not export its notices' }
          $notices = Get-Content notices-ci.txt -Raw
          if ($notices -notmatch 'SIL OPEN FONT LICENSE' -or $notices -notmatch 'GNU LESSER GENERAL PUBLIC LICENSE') { throw 'Embedded font or FFmpeg license text is missing' }
      - name: Check SDK extraction and native initialization
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ApexVoidPhotobooth.exe -ArgumentList '--canon-validate', "$PWD\canon-ci.json" -Wait -PassThru
          if (-not (Test-Path canon-ci.json)) { throw "Canon validation did not write a report (exit $($p.ExitCode))" }
          $r = Get-Content canon-ci.json -Raw | ConvertFrom-Json
          if ($r.sdk.kind -or $r.sdk.machine -ne 'x64') { throw "Bundled SDK inspection failed: $($r.sdk | ConvertTo-Json)" }
          $detected = $r.steps | Where-Object { $_.n -eq 1 }
          if ($detected.detail -notmatch 'no Canon camera found') { throw "SDK discovery did not complete as expected on a camera-free runner: $($detected | ConvertTo-Json)" }
          Write-Host 'Bundled SDK extracted, loaded, initialized and enumerated; camera operation remains unverified.'
      - name: Application self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ApexVoidPhotobooth.exe -ArgumentList '--selftest', "$PWD\selftest.json" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content selftest.json; throw "Application self-test failed (exit $($p.ExitCode))" }
          $r = Get-Content selftest.json -Raw | ConvertFrom-Json
          $ff = $r.checks | Where-Object { $_.name -eq 'FFmpeg' }
          if (-not $ff.ok -or $ff.detail -notlike '*built into this application*') { throw 'Bundled FFmpeg was not found' }
          $enc = $r.checks | Where-Object { $_.name -eq 'H.264 encoder' }
          if (-not $enc.ok -or -not $r.frameFlow.ok -or -not $r.frameFlow600.ok) { throw 'Portable executable failed encoder or frame-flow checks' }
      - name: Keep the notices exported by the validated executable
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-canon-notices
          path: notices-ci.txt
          if-no-files-found: error
          retention-days: 30
      - name: Remove the artifact if validation fails
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.canon-portable.outputs.artifact_id }}
        run: |
          if ($env:ARTIFACT_ID) {
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:ARTIFACT_ID"
            if ($LASTEXITCODE -ne 0) { throw 'Could not remove the failed build artifact' }
          }

  # ---------------------------------------------------------------- official releases (docs/RELEASING.md)
  # Decides, without secrets, whether this run publishes: master only, publishing enabled and every gate
  # approved in release/publication.json, approved notes in docs/releases/v<version>.md, and a version that is
  # not published yet (a manual run may retry it: identical files are a no-op, different files a conflict).
  release-gate:
    name: Release decision
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: [go, frontend, windows, canon-portable, canon-windows-smoke]
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      variant: ${{ steps.decide.outputs.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: decide
        run: python3 scripts/release/release.py eligibility --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF"

  # Publishes the executable validated above to photobooth.apexvoid.net through ansible-library. Retry a failed
  # publication with "Re-run failed jobs": it reuses this run's artifacts and never rebuilds.
  publish:
    name: Publish to photobooth.apexvoid.net
    needs: [go, frontend, windows, canon-portable, canon-windows-smoke, release-gate]
    if: needs.release-gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: photobooth-release
      url: https://photobooth.apexvoid.net/download/
    concurrency:
      group: photobooth-release
      cancel-in-progress: false
    env:
      # Pinned: the publisher, its storage contract and the pinned VPS host key. Bump deliberately.
      ANSIBLE_LIBRARY_REF: e1e096ac08b8afca02cd332ef1449a5b7722dd71
      VERSION: ${{ needs.release-gate.outputs.version }}
      VARIANT: ${{ needs.release-gate.outputs.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the validated standard executable
        if: env.VARIANT == 'standard'
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-standard
          path: candidate
      - name: Fetch the validated Canon executable
        if: env.VARIANT == 'canon'
        uses: actions/download-artifact@v4
        with:
          name: ApexVoidPhotobooth-windows-x64
          path: candidate/dist
      - name: Fetch the Canon executable's notices
        if: env.VARIANT == 'canon'
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-canon-notices
          path: candidate
      - uses: actions/checkout@v4
        with:
          repository: st-mich43l/ansible-library
          ref: ${{ env.ANSIBLE_LIBRARY_REF }}
          path: .ansible-library
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assemble and validate the release package
        id: package
        env:
          EXPECTED_SHA256: ${{ env.VARIANT == 'canon' && needs.canon-portable.outputs.sha256 || needs.windows.outputs.release_sha256 }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA256"
          python3 scripts/release/release.py assemble --exe candidate/dist/ApexVoidPhotobooth.exe --notices candidate/notices-ci.txt \
            --out "$RUNNER_TEMP/release" --commit "$GITHUB_SHA" --variant "$VARIANT" --expected-sha256 "$EXPECTED_SHA256" \
            --candidate-manifest "$RUNNER_TEMP/candidate-manifest.json"
          python3 -I .ansible-library/roles/publish_photobooth_release/files/publish_release.py --root "$RUNNER_TEMP/unused" \
            validate "$RUNNER_TEMP/candidate-manifest.json"
      - name: Publish through ansible-library
        working-directory: .ansible-library
        env:
          VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          python -m pip install --quiet 'ansible-core==2.21.4'
          ansible-playbook playbooks/publish-photobooth-release.yml \
            -e release_src="$RUNNER_TEMP/release" -e release_version="$VERSION" -e release_sha256="$SHA256" \
            --vault-password-file <(printf '%s' "$VAULT_PASS")
      - name: Verify the public download from outside
        env:
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          base=https://photobooth.apexvoid.net/downloads
          name="ApexVoidPhotobooth-v${VERSION}-windows-x64.exe"
          curl -fsS -H 'Cache-Control: no-cache' "$base/index.json" -o "$RUNNER_TEMP/index.json"
          python3 -c "import json,sys; m=json.load(open(sys.argv[1])); assert any(r['version']==sys.argv[2] for r in m['releases']), 'not in manifest'" "$RUNNER_TEMP/index.json" "$VERSION"
          mkdir -p "$RUNNER_TEMP/verify" && cd "$RUNNER_TEMP/verify"
          curl -fsS -o "$name" "$base/releases/v$VERSION/$name"
          curl -fsS -o SHA256SUMS "$base/releases/v$VERSION/SHA256SUMS"
          sha256sum -c SHA256SUMS
          test "$(sha256sum "$name" | cut -d' ' -f1)" = "$SHA256"
      - name: Summary
        if: always()
        env:
          SHA256: ${{ steps.package.outputs.sha256 }}
          SIZE: ${{ steps.package.outputs.size }}
        run: |
          {
            echo "## Release v${VERSION} (${VARIANT})"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Executable | \`ApexVoidPhotobooth-v${VERSION}-windows-x64.exe\` |"
            echo "| SHA-256 | \`${SHA256:-n/a}\` |"
            echo "| Size | ${SIZE:-n/a} bytes |"
            echo "| Signed | no (not code-signed) |"
            echo "| Commit | \`${GITHUB_SHA}\` |"
            echo "| ansible-library | \`${ANSIBLE_LIBRARY_REF}\` |"
            echo "| Download page | https://photobooth.apexvoid.net/download/ |"
            echo
            echo "Job status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
