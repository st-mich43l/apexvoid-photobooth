name: Windows portable preview

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/desktop-windows-phase1
    paths:
      - 'desktop-bootstrap/**'
      - 'scripts/bootstrap-desktop.ps1'
      - '.github/workflows/windows-portable.yml'
  pull_request:
    paths:
      - 'desktop-bootstrap/**'
      - 'scripts/bootstrap-desktop.ps1'
      - '.github/workflows/windows-portable.yml'

jobs:
  portable-windows-x64:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          if ($LASTEXITCODE -ne 0) { throw 'Wails CLI install failed' }
          "$env:USERPROFILE\go\bin" >> $env:GITHUB_PATH
      - name: Build Windows portable preview
        shell: pwsh
        run: .\scripts\bootstrap-desktop.ps1
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: ApexVoid-Photobooth-Windows-x64-portable
          path: desktop/bin/*.exe
          if-no-files-found: error
          retention-days: 14
